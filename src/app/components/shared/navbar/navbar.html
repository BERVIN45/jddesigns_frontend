<nav class="navbar" [class.scrolled]="isScrolled" [class.hero-theme]="isHeroPage && !isScrolled">
  <div class="container-fluid navbar-content">
    <a routerLink="/" class="logo">
      <img src="images/logo.png" alt="JD Designs Logo" class="logo-img">
      <span class="logo-text">
        <span class="logo-jd">DJ</span>
        <span class="logo-designs">DESIGNS</span>
      </span>
    </a>
    
    <div class="nav-links" [class.active]="isMenuOpen">
      <a routerLink="/home" routerLinkActive="active" (click)="isMenuOpen = false">Home</a>
      <a routerLink="/about" routerLinkActive="active" (click)="isMenuOpen = false">About</a>
      <div class="dropdown">
        <a routerLink="/services" routerLinkActive="active" class="dropdown-toggle" (click)="isMenuOpen = false">
          Services
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="dropdown-icon"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </a>
        <div class="dropdown-menu">
          <a routerLink="/services/kitchen" (click)="isMenuOpen = false">Kitchen</a>
          <a routerLink="/services/living-room" (click)="isMenuOpen = false">Living Room</a>
          <a routerLink="/services/bedroom" (click)="isMenuOpen = false">Bedroom</a>
          <a routerLink="/services/office" (click)="isMenuOpen = false">Office</a>
          <a routerLink="/services/dining-room" (click)="isMenuOpen = false">Dining Room</a>
        </div>
      </div>
      <a routerLink="/gallery" routerLinkActive="active" (click)="isMenuOpen = false">Gallery</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="isMenuOpen = false">Contact</a>
      <a routerLink="/contact" class="nav-cta" (click)="isMenuOpen = false">Get a Quote</a>
    </div>

    <div class="menu-toggle" (click)="toggleMenu()">
      <div class="bar" [class.open]="isMenuOpen"></div>
    </div>
  </div>
</nav>
