<div class="page-header" style="background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)), url('images/hero.jpg');">
  <div class="container reveal">
    <h1>Our Services</h1>
    <p>Comprehensive Interior Design Solutions</p>
  </div>
</div>

<section class="section bg-white services-listing">
  <div class="container">
    <div class="service-block reveal" *ngFor="let service of servicesList; let i = index" [class.reverse]="i % 2 !== 0">
      
      <div class="service-image-wrapper">
        <img [src]="service.image" [alt]="service.alt" class="service-image">
      </div>
      
      <div class="service-content">
        <h2 class="service-title">{{ service.title }}</h2>
        <p class="service-lead">{{ service.lead }}</p>
        
        <ul class="service-bullets">
          <li *ngFor="let bullet of service.bullets">
            <span class="bullet-dot"></span>
            {{ bullet }}
          </li>
        </ul>
        
        <a routerLink="/contact" class="btn btn-primary service-btn">Enquire Now</a>
      </div>
      
    </div>
  </div>
</section>
